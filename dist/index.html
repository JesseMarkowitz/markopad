<style>/* MarkoPad interface. The rendered-document styles live in markdown.css. */
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --fg: #1f2328;
  --muted: #5b6672;
  --border: #d1d9e0;
  --accent: #0b5cad;
  --accent-fg: #ffffff;
  --hover: #e8ecf0;
  --warn-bg: #fff4d6;
  --warn-fg: #6b4a00;
  --warn-border: #e2b93b;
  --danger: #b3261e;
  --shadow: 0 8px 30px rgba(20, 30, 45, 0.22);
  --editor-bg: #fcfcfd;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1013;
    --panel: #15181c;
    --fg: #e3e7ec;
    --muted: #9aa5b1;
    --border: #363d46;
    --accent: #7ab8ff;
    --accent-fg: #0b1220;
    --hover: #232a32;
    --warn-bg: #3a2f08;
    --warn-fg: #ffe08a;
    --warn-border: #8a6d10;
    --danger: #ff8a80;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    --editor-bg: #111418;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1013;
  --panel: #15181c;
  --fg: #e3e7ec;
  --muted: #9aa5b1;
  --border: #363d46;
  --accent: #7ab8ff;
  --accent-fg: #0b1220;
  --hover: #232a32;
  --warn-bg: #3a2f08;
  --warn-fg: #ffe08a;
  --warn-border: #8a6d10;
  --danger: #ff8a80;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
  --editor-bg: #111418;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
[hidden] { display: none !important; }

button, .btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 0.35em;
  min-height: 32px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--panel);
  color: var(--fg);
  font: inherit;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
}
button:hover, .btn:hover { background: var(--hover); }
button:focus-visible, .btn:focus-visible, a:focus-visible, textarea:focus-visible,
input:focus-visible, [tabindex]:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); background: var(--accent); }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

/* ---------- top bar ---------- */
#bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
#brand { margin-right: 6px; font-weight: 700; font-size: 15px; letter-spacing: 0.01em; }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.spacer { flex: 1 1 12px; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
.seg button:last-child { border-radius: 0 7px 7px 0; }

.menu { position: relative; }
.menu-list {
  position: absolute;
  z-index: 30;
  top: calc(100% + 4px);
  left: 0;
  display: flex;
  flex-direction: column;
  min-width: 230px;
  padding: 5px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 9px;
  box-shadow: var(--shadow);
}
.menu-list button { justify-content: flex-start; border-color: transparent; background: none; }
.menu-list button:hover, .menu-list button:focus-visible { background: var(--hover); }
.menu-list small { color: var(--muted); margin-left: auto; padding-left: 1.5em; }

/* ---------- panes ---------- */
#panes {
  --split: 50;
  flex: 1 1 auto;
  display: flex;
  min-height: 0;
}
/* Each pane lays itself out alone, so typing in one never makes the browser re-measure the other. */
#editor-pane, #preview-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; contain: strict; }
#editor-pane { flex: 0 0 calc(var(--split) * 1%); }
#preview-pane { flex: 1 1 0; background: var(--panel); }
#editor {
  flex: 1 1 auto;
  width: 100%;
  margin: 0;
  padding: 16px 18px;
  border: 0;
  resize: none;
  background: var(--editor-bg);
  color: var(--fg);
  font: 14.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  tab-size: 4;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}
#editor:focus-visible { outline: none; }   /* the text cursor shows where you are */
#preview-scroll { flex: 1 1 auto; overflow: auto; contain: strict; }
#preview { padding: 20px 24px 60px; max-width: 900px; min-height: 100%; }
#preview:empty::before { content: "The formatted document appears here."; color: var(--muted); }

#divider {
  flex: 0 0 11px;
  position: relative;
  background: var(--bg);
  border: solid var(--border);
  border-width: 0 1px;
  cursor: col-resize;
  touch-action: none;
}
#divider::after {
  content: "";
  position: absolute;
  inset: 0;
  margin: auto;
  width: 3px;
  height: 34px;
  border-radius: 2px;
  background: var(--muted);
  opacity: 0.55;
}
#divider:hover, #divider.dragging, #divider:focus-visible { background: var(--hover); }
#divider:hover::after, #divider.dragging::after { opacity: 1; background: var(--accent); }
body.dragging { user-select: none; cursor: col-resize; }

body[data-view="edit"] #preview-pane, body[data-view="edit"] #divider { display: none; }
body[data-view="edit"] #editor-pane { flex: 1 1 auto; }
body[data-view="preview"] #editor-pane, body[data-view="preview"] #divider { display: none; }

/* Narrow screens: "Both" stacks the panes, text on top. */
body[data-narrow="true"] #panes { flex-direction: column; }
body[data-narrow="true"] #divider { border-width: 1px 0; cursor: row-resize; }
body[data-narrow="true"] #divider::after { width: 34px; height: 3px; }
body[data-narrow="true"].dragging { cursor: row-resize; }
body[data-narrow="true"] #preview { padding: 16px 16px 48px; }
body[data-narrow="true"] #editor { padding: 14px 16px; font-size: 16px; }
/* A compact bar for phones: one flowing set of smaller buttons instead of separate groups. */
body[data-narrow="true"] #bar { gap: 5px; padding: 5px 8px; }
body[data-narrow="true"] #brand, body[data-narrow="true"] .spacer { display: none; }
body[data-narrow="true"] .group { display: contents; }
body[data-narrow="true"] #bar button, body[data-narrow="true"] #bar .btn { min-height: 34px; padding: 0 9px; font-size: 13.5px; }
body[data-narrow="true"]:not([data-view="both"]) #btn-sync { display: none; }
body[data-narrow="true"] .menu-list button { min-height: 40px; }
body[data-narrow="true"] #status { gap: 10px; font-size: 12px; }
body[data-narrow="true"] #recovery { display: none; }
body[data-narrow="true"] #recovery.off { display: inline; }

/* ---------- blocked-image notice and placeholders ---------- */
#img-notice {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  background: var(--warn-bg);
  color: var(--warn-fg);
  border-bottom: 1px solid var(--warn-border);
  font-size: 13px;
}
#img-notice a { color: inherit; }
/* Nothing blocked, only a reminder that remote images are showing: a calmer bar. */
#img-notice.calm { background: var(--bg); color: var(--muted); border-bottom-color: var(--border); }
.mp-blocked, .mp-unavailable-img {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  margin: 2px 0;
  padding: 6px 9px;
  border: 1px dashed var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--muted);
  font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  text-decoration: none;
  vertical-align: middle;
}
.mp-blocked b { color: var(--fg); overflow-wrap: anywhere; }
.mp-blocked button { min-height: 26px; padding: 0 8px; font-size: 12.5px; }
.mp-link.mp-suspicious { background: var(--warn-bg); color: var(--warn-fg); border-radius: 3px; }
.mp-flag { margin-left: 0.25em; font-size: 0.85em; text-decoration: none; display: inline-block; }
.mp-unavailable { color: var(--muted); text-decoration: underline dotted; cursor: help; }

/* ---------- status line ---------- */
#status {
  display: flex;
  gap: 14px;
  align-items: center;
  min-height: 26px;
  padding: 3px 12px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 12.5px;
}
#status-msg { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#status-msg.strong { color: var(--fg); }
#recovery.off { color: var(--danger); }
#version { flex: none; white-space: nowrap; }

/* ---------- How do I…? panel ---------- */
#howto {
  position: fixed;
  z-index: 20;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(430px, 100%);
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow);
}
#howto-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
#howto-head h2 { flex: 1; margin: 0; font-size: 15px; }
#howto-search {
  margin: 10px 12px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--editor-bg);
  color: var(--fg);
  font: inherit;
  font-size: 15px;
}
#howto-list { flex: 1 1 auto; overflow: auto; padding: 0 12px 16px; }
#howto-empty { color: var(--muted); padding: 8px 2px; }
.how {
  padding: 10px 0 12px;
  border-top: 1px solid var(--border);
}
.how h3 { margin: 0 0 6px; font-size: 14px; }
.how-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.how-label { margin: 0 0 3px; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
.how pre.how-src {
  margin: 0;
  padding: 7px 8px;
  overflow: auto;
  max-height: 180px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.how .md {
  padding: 7px 8px;
  overflow: auto;
  max-height: 180px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13.5px;
}
.how .md h1 { font-size: 1.35em; }
.how .md h2 { font-size: 1.2em; }
.how .md h3 { font-size: 1.05em; }
.how .md h1, .how .md h2, .how .md h3 { margin: 0 0 0.3em; }
.how-note { margin: 6px 0 0; color: var(--muted); font-size: 12.5px; }
.how-actions { display: flex; gap: 6px; margin-top: 8px; }
.how-actions button { min-height: 28px; }

/* ---------- dialogs and overlays ---------- */
dialog {
  width: min(520px, calc(100% - 24px));
  padding: 18px 20px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: var(--fg);
  box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10, 15, 22, 0.5); }
#dlg-title { margin: 0 0 10px; font-size: 17px; }
#dlg-body { font-size: 14.5px; line-height: 1.5; }
#dlg-body p { margin: 0 0 10px; }
#dlg-body .host { font-size: 19px; font-weight: 700; overflow-wrap: anywhere; }
#dlg-body .addr {
  display: block;
  max-height: 110px;
  margin: 0 0 10px;
  padding: 8px 10px;
  overflow: auto;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  overflow-wrap: anywhere;
}
#dlg-body .warnbox {
  margin: 0 0 10px;
  padding: 8px 10px 8px 28px;
  background: var(--warn-bg);
  color: var(--warn-fg);
  border: 1px solid var(--warn-border);
  border-radius: 7px;
}
#dlg-body .warnbox li + li { margin-top: 4px; }
#dlg-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 14px; }
#drop-overlay {
  position: fixed;
  z-index: 40;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(11, 92, 173, 0.16);
  border: 3px dashed var(--accent);
  color: var(--fg);
  font-size: 20px;
  font-weight: 600;
  pointer-events: none;
}
#noscript { padding: 24px; font-size: 16px; }
.mp-offscreen { position: fixed; left: -9999px; top: 0; width: 640px; opacity: 0; pointer-events: none; }

/* ---------- printing: the formatted document only ---------- */
@media print {
  html, body { height: auto; overflow: visible; display: block; background: #fff; }
  #bar, #status, #editor-pane, #divider, #howto, #img-notice, #drop-overlay, dialog { display: none !important; }
  #panes, #preview-pane, #preview-scroll { display: block !important; overflow: visible; height: auto; contain: none; }
  #preview { max-width: none; padding: 0; }
  .md, :root[data-theme="dark"] .md, :root:not([data-theme="light"]) .md {
    --md-fg: #000;
    --md-muted: #444;
    --md-bg: #fff;
    --md-soft: #f3f3f3;
    --md-border: #bbb;
    --md-link: #0b3d91;
    --md-mark: #fff3a3;
  }
  .mp-blocked button { display: none; }
}

/* Styling for rendered Markdown. Used by the preview pane and by exported HTML files. */
.md {
  --md-fg: #1f2328;
  --md-muted: #59636e;
  --md-bg: #ffffff;
  --md-soft: #f3f5f7;
  --md-border: #d1d9e0;
  --md-link: #0b5cad;
  --md-mark: #fff3a3;
  color: var(--md-fg);
  background: var(--md-bg);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-wrap: break-word;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .md {
    --md-fg: #e3e7ec;
    --md-muted: #9aa5b1;
    --md-bg: #15181c;
    --md-soft: #1f242a;
    --md-border: #363d46;
    --md-link: #7ab8ff;
    --md-mark: #6b5a00;
  }
}
:root[data-theme="dark"] .md {
  --md-fg: #e3e7ec;
  --md-muted: #9aa5b1;
  --md-bg: #15181c;
  --md-soft: #1f242a;
  --md-border: #363d46;
  --md-link: #7ab8ff;
  --md-mark: #6b5a00;
}
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
  margin: 1.5em 0 0.6em;
  line-height: 1.25;
  font-weight: 650;
}
.md h1 { font-size: 1.9em; padding-bottom: 0.25em; border-bottom: 1px solid var(--md-border); }
.md h2 { font-size: 1.45em; padding-bottom: 0.25em; border-bottom: 1px solid var(--md-border); }
.md h3 { font-size: 1.2em; }
.md h4 { font-size: 1em; }
.md h5 { font-size: 0.9em; }
.md h6 { font-size: 0.85em; color: var(--md-muted); }
.md p, .md ul, .md ol, .md blockquote, .md pre, .md table, .md details, .md dl { margin: 0 0 1em; }
.md ul, .md ol { padding-left: 1.8em; }
.md li + li { margin-top: 0.2em; }
.md li > ul, .md li > ol { margin: 0.2em 0 0; }
.md li > p { margin-bottom: 0.5em; }
.md li:has(> input[type="checkbox"]) { list-style: none; }
.md li > input[type="checkbox"] { margin: 0 0.45em 0 -1.45em; vertical-align: middle; }
.md a { color: var(--md-link); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.md blockquote {
  padding: 0.1em 1em;
  color: var(--md-muted);
  border-left: 4px solid var(--md-border);
}
.md blockquote > :last-child { margin-bottom: 0; }
.md code, .md kbd, .md samp, .md pre {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 0.88em;
}
.md code { padding: 0.15em 0.4em; background: var(--md-soft); border-radius: 5px; }
.md pre {
  padding: 0.9em 1em;
  overflow: auto;
  background: var(--md-soft);
  border-radius: 8px;
  line-height: 1.45;
}
.md pre code { padding: 0; background: none; font-size: 1em; white-space: pre; }
.md kbd {
  padding: 0.1em 0.45em;
  border: 1px solid var(--md-border);
  border-bottom-width: 2px;
  border-radius: 5px;
  background: var(--md-soft);
}
.md mark { background: var(--md-mark); color: inherit; padding: 0 0.15em; border-radius: 3px; }
.md hr { height: 1px; margin: 1.6em 0; border: 0; background: var(--md-border); }
.md table { display: block; width: max-content; max-width: 100%; overflow: auto; border-collapse: collapse; }
.md th, .md td { padding: 0.4em 0.8em; border: 1px solid var(--md-border); }
.md th { background: var(--md-soft); font-weight: 600; }
.md img { max-width: 100%; height: auto; }
.md summary { cursor: pointer; font-weight: 600; }
.md details { padding: 0.5em 0.9em; border: 1px solid var(--md-border); border-radius: 8px; }
.md details[open] > summary { margin-bottom: 0.6em; }
.md dt { font-weight: 600; }
.md dd { margin: 0 0 0.6em 1.5em; }
</style>
</head>
<body data-view="both" data-narrow="false">

<header id="bar">
  <span id="brand">MarkoPad</span>
  <div class="group" role="group" aria-label="Document">
    <button type="button" id="btn-new" title="Start a new document. Wipes the text and its recovery copy from this tab.">New</button>
    <button type="button" id="btn-open" title="Open a text or Markdown file from this device (Ctrl+O). You can also drop a file onto the page.">Open</button>
    <div class="menu">
      <button type="button" id="btn-download" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-download" title="Save the document to this device, or print it">Download ▾</button>
      <div class="menu-list" id="menu-download" role="menu" hidden>
        <button type="button" role="menuitem" id="act-save-md" title="Save the raw text as a .md file">Markdown file (.md) <small>Ctrl+S</small></button>
        <button type="button" role="menuitem" id="act-save-html" title="Save the formatted document as a single web page that needs nothing else to display">Web page (.html)</button>
        <button type="button" role="menuitem" id="act-print" title="Print the formatted document, or choose “Save as PDF” in the print window">Print or save as PDF <small>Ctrl+P</small></button>
      </div>
    </div>
    <div class="menu">
      <button type="button" id="btn-copy" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-copy" title="Copy the whole document to the clipboard">Copy ▾</button>
      <div class="menu-list" id="menu-copy" role="menu" hidden>
        <button type="button" role="menuitem" id="act-copy-md" title="Copy the raw Markdown text">Markdown text</button>
        <button type="button" role="menuitem" id="act-copy-rich" title="Copy the formatted document, ready to paste into an email or a word processor">Formatted text</button>
        <button type="button" role="menuitem" id="act-copy-html" title="Copy the formatted document as HTML code">HTML code</button>
      </div>
    </div>

window.MP_BUILD = {"version":"0.1.0","help":"# MarkoPad Help\n\nMarkoPad is a Markdown editor and viewer with two panes. You type or paste plain text on the left and read the formatted document on the right. It runs entirely inside this browser tab. **Nothing you type or open is ever sent anywhere.**\n\nYou are reading this help inside MarkoPad itself. The left pane shows the Markdown that produces what you see on the right, so every part of this page is also a worked example. Change anything you like; this copy is yours and disappears when you close the tab.\n\nVersion 0.1.0.\n\n## Contents\n\n- [Quick start](#quick-start)\n- [The screen](#the-screen)\n- [Getting text in](#getting-text-in)\n- [Getting text out](#getting-text-out)\n- [Several documents at once](#several-documents-at-once)\n- [What is kept, and what is not](#what-is-kept-and-what-is-not)\n- [Links](#links)\n- [Remote images and your privacy](#remote-images-and-your-privacy)\n- [Markdown reference](#markdown-reference)\n- [Keyboard](#keyboard)\n- [Hosting MarkoPad, or running it from a disk](#hosting-markopad-or-running-it-from-a-disk)\n- [Limits worth knowing](#limits-worth-knowing)\n- [About](#about)\n\n## Quick start\n\n1. Type in the left pane, or paste text into it.\n2. Read the result in the right pane. It updates as you type.\n3. When you are done, use **Download** or **Copy** at the top.\n\nIf you do not know how to write something, press **How do I…?** and type what you want, such as *table* or *bold*. Each answer has an **Insert** button that places the example where your cursor is.\n\n## The screen\n\n| Control | What it does |\n| --- | --- |\n| **New** | Starts an empty document and wipes the old text from this tab. |\n| **Open** | Opens a text or Markdown file from this device. |\n| **Download** | Saves the raw text as a `.md` file, saves the formatted document as a web page, or prints it. |\n| **Copy** | Copies the whole document as Markdown, as formatted text, or as HTML code. |\n| **New window** | Opens another, empty MarkoPad in a new tab. |\n| **Edit / Both / Preview** | Chooses which panes are shown. |\n| **Sync scroll** | Keeps the two panes at the same place. Click to turn it off. |\n| **Dark / Light** | Switches the colours for this tab. |\n| **How do I…?** | A searchable cheat sheet with Insert and Copy buttons. |\n| **Help** | Opens this document in a new tab. |\n\n**The divider.** Drag the bar between the panes with a mouse or a finger. With the keyboard, move to it with Tab and use the arrow keys; Home and End jump to the ends, and Enter centres it. Double-click or double-tap also centres it.\n\n**On a phone.** A narrow screen starts with one pane. Use **Edit** and **Preview** to switch. **Both** stacks the panes, text on top, with the same draggable divider.\n\n**The bottom line** shows the number of lines, words and characters, whether the recovery copy is on, and short messages such as \"Copied\". The version of MarkoPad you are running is at its right-hand end.\n\n## Getting text in\n\n- **Paste** into the left pane.\n- **Open** a file with the Open button or \u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>O\u003c/kbd>.\n- **Drop** a file anywhere on the page.\n\nIf the document is not empty, MarkoPad asks before replacing it. It never merges two documents.\n\n## Getting text out\n\n- **Copy → Markdown text** copies the raw text.\n- **Copy → Formatted text** copies the formatted document. Paste it into an email or a word processor and the headings, lists and tables come with it.\n- **Copy → HTML code** copies the formatted document as HTML source.\n- **Download → Markdown file** saves a `.md` file. The name comes from the file you opened, or from the first heading.\n- **Download → Web page** saves one `.html` file that shows the formatted document in any browser, with nothing else needed. It contains no scripts.\n- **Download → Print or save as PDF** opens the browser's print window. Only the formatted document is printed. Choose \"Save as PDF\" there to make a PDF.\n\nA web page you download keeps any remote images as ordinary image addresses. Whoever opens that file will load those images from their original sites. See [Remote images and your privacy](#remote-images-and-your-privacy).\n\n## Several documents at once\n\nEvery tab or window that holds MarkoPad is a separate document. What you do in one never touches another. Press **New window** for another empty one, and use the browser's own tabs and windows to arrange them.\n\nThe tab title shows the document name, so you can tell tabs apart. MarkoPad picks the name in this order:\n\n1. the name of the file you opened;\n2. the first heading in the text;\n3. the first line of the text;\n4. \"Untitled\" and the time the tab was started.\n\nA dot in front of the name (●) means there are changes you have not downloaded.\n\n## What is kept, and what is not\n\nMarkoPad stores no document permanently. There is no document list, no history and no account.\n\nTwo things protect you from losing work by accident:\n\n- **The leaving warning.** If you close or leave a tab with unsaved changes, the browser asks whether you really want to leave. The browser chooses the wording. Some phone browsers do not show this warning at all.\n- **The recovery copy.** While a tab is open, it keeps a copy of its own text so that a reload or a browser crash does not lose it. The copy is discarded when the tab is closed.\n\n\"Unsaved\" means you have edited the text since you last opened a file, downloaded the Markdown file, or pressed New. Pasting a document into an empty page so you can read it does not count as an edit.\n\nThings to know about the recovery copy:\n\n- While the tab is open, the browser writes the copy into its own profile on this device's disk.\n- If you close a tab and then use the browser's \"reopen closed tab\", the text may come back.\n- A private or incognito window leaves nothing behind once it is closed.\n- **New** wipes the text and its recovery copy at once.\n- A very large document may not fit. The bottom line then says the recovery copy is off, and everything else keeps working.\n\nThe **Download → Markdown file** button is the only real way to keep a document.\n\n## Links\n\nA Markdown link can show one address and lead to another. To protect you, MarkoPad does the following.\n\n- **It asks before opening any link.** The question shows the site the link really goes to, in large type, and the full address beneath it.\n- **It shows the real destination** when you point at a link or move to it with the keyboard. Any tooltip supplied by the document is thrown away.\n- **It marks suspicious links** with a warning sign (⚠) when:\n  - the visible text names one site but the link goes to another;\n  - the site name uses lookalike letters from another alphabet;\n  - the link goes to a bare numeric address;\n  - the address hides a name in front of an `@` sign.\n- Only web links and email links work. Anything else is shown as plain text.\n- A link opens in a new tab that cannot reach back into MarkoPad, and the site is not told where you came from.\n\nMarkoPad cannot tell you whether a site is trustworthy. Checking that would mean sending your links to an outside service. Read the site name in the question before you press Open.\n\nTry it. This link claims to go to one site and goes to another: [https://www.example.com](https://example.org/somewhere-else)\n\n## Remote images and your privacy\n\n**Loading an image from another site tells that site your network address, what browser you use, and the moment you opened the document.** Someone who sends you a document can use an image this way to learn that you read it, and roughly where you are.\n\nFor that reason MarkoPad blocks remote images until you choose otherwise. Each blocked image is replaced by a box naming the site it would come from. You can then:\n\n- **Load** that one image;\n- **Load all from that site**, which loads every image in the document that comes from exactly the same site name;\n- **Load all**, at the top of the preview, for every image in the document.\n\nYour choice applies to this document in this tab only. Opening another document clears it.\n\n**Changing your mind.** While remote images are showing, the bar at the top of the preview says how many and offers **Block again**. That removes them from view and forgets which sites you allowed, so nothing more is loaded. It cannot take back what has already happened: a site that sent you an image has already seen your address.\n\nImages that are embedded inside the document itself need no network and are always shown.\n\nHere is a remote image to try it with:\n\n![A sample remote picture](https://example.com/sample-picture.png)\n\n## Markdown reference\n\nMarkoPad uses GitHub-Flavored Markdown. The **How do I…?** panel has every item below with an Insert button.\n\n### Text\n\n| To get | Type |\n| --- | --- |\n| **Bold** | `**Bold**` |\n| *Italic* | `*Italic*` |\n| ~~Crossed out~~ | `~~Crossed out~~` |\n| `Code` | `` `Code` `` |\n| A [link](https://example.com) | `[link](https://example.com)` |\n| \u003ckbd>Ctrl\u003c/kbd> | `\u003ckbd>Ctrl\u003c/kbd>` |\n| \u003cmark>Highlight\u003c/mark> | `\u003cmark>Highlight\u003c/mark>` |\n| H\u003csub>2\u003c/sub>O, x\u003csup>2\u003c/sup> | `H\u003csub>2\u003c/sub>O, x\u003csup>2\u003c/sup>` |\n\n### Headings\n\n```\n# Biggest heading\n## Second level\n### Third level\n```\n\n### Lists\n\n- A bulleted item starts with a hyphen and a space.\n- Another item.\n    - Indent to put a list inside a list.\n\n1. A numbered item starts with a number, a full stop and a space.\n2. Another step.\n\n- [x] A finished task\n- [ ] A task still to do\n\nPress Enter inside a list and MarkoPad starts the next item for you. Press Enter on an empty item to end the list.\n\n### Quotations\n\n> Start each line with a greater-than sign.\n\n### Code blocks\n\nPut three backticks on the line before and the line after:\n\n```\nanything in here is shown exactly as typed\n```\n\n### Tables\n\n```\n| Name | Role     |\n| ---- | -------- |\n| Ada  | Engineer |\n```\n\n| Name | Role     |\n| ---- | -------- |\n| Ada  | Engineer |\n\n### Dividing line\n\nThree hyphens on a line of their own:\n\n---\n\n### Things MarkoPad leaves out on purpose\n\nColours, fonts, sizes and positioning written into a document are removed, so that a document from someone else cannot disguise itself or cover MarkoPad's own controls. Scripts, forms and embedded pages are removed for the same reason. Footnotes, math and diagrams are not part of this version.\n\n## Keyboard\n\n| Keys | Action |\n| --- | --- |\n| \u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>O\u003c/kbd> | Open a file |\n| \u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>S\u003c/kbd> | Download the Markdown file |\n| \u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>P\u003c/kbd> | Print the formatted document |\n| \u003ckbd>Tab\u003c/kbd> | Indent the current line or the selected lines |\n| \u003ckbd>Shift\u003c/kbd> + \u003ckbd>Tab\u003c/kbd> | Remove one level of indent |\n| \u003ckbd>Esc\u003c/kbd> then \u003ckbd>Tab\u003c/kbd> | Leave the text pane with the keyboard |\n| \u003ckbd>Esc\u003c/kbd> | Close a menu, a question or the How do I…? panel |\n\nOn a Mac, use \u003ckbd>⌘\u003c/kbd> in place of \u003ckbd>Ctrl\u003c/kbd>. Undo, redo, find and spell check are the browser's own and work as they do in any text box.\n\n## Hosting MarkoPad, or running it from a disk\n\nMarkoPad is one file, `index.html`. Everything it needs is inside that file.\n\n- **On a web server.** Put the file in any folder that a web server serves. There is nothing to install, build or configure. On StartOS, put it in a folder and point Start9 Pages at that folder.\n- **From a disk.** Double-click the file. It opens in your browser and works with no web server and no internet connection.\n\nThe server that hands out the file learns only that the page was fetched. It never receives a document, and the page contains no way to send one. The page also carries a rule that tells the browser to refuse any data connection, so this does not depend on trusting the page alone. You can check it yourself: open the browser's developer tools, choose the Network tab, and use MarkoPad. Nothing appears after the page itself, apart from any image you chose to load.\n\n**Secure pages.** Browsers allow full clipboard access only on a page served over HTTPS, or opened from a disk or from `localhost`. On a plain `http://` address MarkoPad falls back to an older copying method, and tells you if that fails.\n\n## Limits worth knowing\n\n- The two panes scroll together by proportion. In a document with long tables or many images they may be a little out of step.\n- Checkboxes in the preview are for display. Change `[ ]` to `[x]` in the text to tick one.\n- A link or an image with no site name in its address, such as `pictures/cat.png`, has nothing to be found relative to, so it is shown as unavailable.\n- Documents of a few hundred kilobytes, which is hundreds of pages, stay smooth. A 1 MB document opens and works, but typing can lag on a slower device, because browsers themselves slow down with that much text in one box.\n- JavaScript must be on. With a browser set to block it, such as Tor Browser at its Safest level, MarkoPad cannot work.\n\n## About\n\nMarkoPad 0.1.0. Free software under the MIT license.\n\nIt includes two open-source libraries, copied into the file rather than loaded from elsewhere:\n\n- **marked**, which turns Markdown into HTML. MIT license.\n- **DOMPurify**, which removes anything unsafe from that HTML. Used under the Mozilla Public License 2.0; its source is at \u003chttps://github.com/cure53/DOMPurify>.\n","howto":[{"t":"Heading","k":"title header h1 h2 h3 section big","block":true,"md":"# Biggest heading\n\n## Second level\n\n### Third level","note":"One to six # signs, then a space."},{"t":"Bold","k":"strong heavy thick","md":"**bold text**"},{"t":"Italic","k":"emphasis slanted","md":"*italic text*"},{"t":"Bold and italic together","k":"strong emphasis","md":"***bold and italic***"},{"t":"Strikethrough","k":"cross out crossed delete line through","md":"~~crossed out~~"},{"t":"Link","k":"url hyperlink website web address","md":"[link text](https://example.com)","note":"MarkoPad asks before it opens any link and shows where the link really goes."},{"t":"Link that shows its own address","k":"autolink bare url plain","md":"https://example.com"},{"t":"Email link","k":"mailto mail address","md":"\u003csomeone@example.com>"},{"t":"Link to a heading in this document","k":"anchor jump contents toc internal","md":"[Jump to the summary](#summary)","note":"After the # write the heading in lower case, with hyphens instead of spaces."},{"t":"Image","k":"picture photo graphic screenshot","md":"![Description of the picture](https://example.com/picture.png)","demo":"![Description of the picture](data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22120%22%20height%3D%2260%22%3E%3Crect%20width%3D%22120%22%20height%3D%2260%22%20rx%3D%228%22%20fill%3D%22%230b5cad%22%2F%3E%3Ccircle%20cx%3D%2230%22%20cy%3D%2224%22%20r%3D%229%22%20fill%3D%22%23ffd866%22%2F%3E%3Cpath%20d%3D%22M10%2052l28-26%2018%2016%2014-10%2040%2020z%22%20fill%3D%22%23fff%22%20opacity%3D%22.85%22%2F%3E%3C%2Fsvg%3E)","note":"Pictures on other sites stay blocked until you choose to load them."},{"t":"Bulleted list","k":"unordered bullets points dots","block":true,"md":"- First item\n- Second item\n- Third item"},{"t":"Numbered list","k":"ordered steps sequence","block":true,"md":"1. First step\n2. Second step\n3. Third step"},{"t":"List inside a list","k":"nested sub item indent outline","block":true,"md":"- Fruit\n    - Apple\n    - Pear\n- Vegetables","note":"Indent the inner items. The Tab key indents the line you are on."},{"t":"Checklist","k":"task list todo to-do checkbox tick box","block":true,"md":"- [x] Finished\n- [ ] Still to do"},{"t":"Quotation","k":"bloc   }
  function cheapHash(s) {
    var h = s.length, n = Math.min(s.length, 96);
    for (var i = 0; i < n; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return h;
  }

  // Cuts the document into pieces that are rendered and cleaned independently, so that an edit
  // costs one small piece instead of the whole document. A piece is a run of top-level blocks.
  //  - Where a piece ends depends only on the text near that point, so typing in one place does
  //    not move the boundaries elsewhere.
  //  - A piece never ends inside an HTML element that a raw HTML block opened (for example
  //    <details> ... </details> spanning several paragraphs): those blocks stay together.
  function chunkTokens(tokens) {
    var chunks = [], cur = null, depth = 0;
    for (var i = 0; i < tokens.length; i++) {
      var tok = tokens[i];
      var cut = depth <= 0 && tok.type !== 'space' &&
        (tok.type === 'heading' || tok.type === 'html' || (cheapHash(tok.raw) & 3) === 0);
      if (!cur || (cut && cur.solid)) {
        cur = { raw: '', tokens: [], solid: false };
        chunks.push(cur);
        depth = 0;
      }
      cur.raw += tok.raw;
      cur.tokens.push(tok);
      if (tok.type !== 'space') cur.solid = true;
      if (tok.type === 'html') depth += htmlDepth(tok.raw);
    }
    return chunks;
  }

  // The document as a list of pieces, each with the key its cleaned form is cached under.
  // Reference-style link definitions can sit anywhere in a document, so they are part of every key.
  function planDocument(text) {
    var tokens = window.marked.lexer(text, MARKED_OPTS);
    var defs = tokens.links && Object.keys(tokens.links).length ? JSON.stringify(tokens.links) : '';
    var chunks = chunkTokens(tokens);
    for (var i = 0; i < chunks.length; i++) chunks[i].key = chunks[i].raw + '\u0000' + defs;
    return chunks;
  }

  // One piece -> { frag, remote }: a cleaned, classified fragment living in a detached document.
  // Nothing in it has touched the network, and it is never shown itself, only copies of it.
  function buildChunk(chunk) {
    var html = window.marked.parser(chunk.tokens, MARKED_OPTS);
    var body = window.DOMPurify.sanitize(html, PURIFY);
    if (!body || body.ownerDocument === document) {
      // Belt and braces: never work on document content inside the live page.
      var inert = new DOMParser().parseFromString(
        window.DOMPurify.sanitize(html, Object.assign({}, PURIFY, { RETURN_DOM: false })), 'text/html');
      body = inert.body;
    }
    normalize(body);
    var frag = body.ownerDocument.createDocumentFragment();
    while (body.firstChild) frag.appendChild(body.firstChild);
    return { frag: frag, remote: frag.querySelector('img[data-mp-kind="remote"]') !== null };
  }

  var chunkCache = new Map();
  function cachedChunk(chunk) {
    var hit = chunkCache.get(chunk.key);
    if (!hit) { hit = buildChunk(chunk); chunkCache.set(chunk.key, hit); }
    return hit;
  }

  // Markdown text -> a <body> element in a detached document holding the whole cleaned document.
  // Used for exported files, the clipboard and the cheat sheet samples.
  function safeBody(text) {
    var body = new DOMParser().parseFromString('', 'text/html').body;
    planDocument(text).forEach(function (chunk) {
      body.appendChild(body.ownerDocument.importNode(cachedChunk(chunk).frag, true));
    });
    assignSlugs(body);
    return body;
  }

  // Gives every heading the name a "#link" refers to: its text in lower case with hyphens.
  function assignSlugs(root) {
    var used = {};
    root.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(function (h) {
      var base = slugify(h.textContent) || 'section';
      var slug = base, n = 1;
      while (used[slug]) slug = base + '-' + n++;
      used[slug] = true;
      h.setAttribute('data-mp-slug', slug);
    });
  }

  function normalize(body) {
    body.querySelectorAll('input').forEach(function (input) {
      if ((input.getAttribute('type') || '').toLowerCase() !== 'checkbox') { input.remove(); return; }
      input.setAttribute('disabled', '');
    });

    body.querySelectorAll('a').forEach(function (a) {
      var href = a.getAttribute('href');
      if (href === null || href.trim() === '') { unwrap(a); return; }
      href = href.trim();
      if (href.charAt(0) === '#') {
        var target = href.slice(1);
        try { target = decodeURIComponent(target); } catch (e) { /* keep as typed */ }
        a.setAttribute('data-mp-kind', 'anchor');
        a.setAttribute('data-mp-target', target.toLowerCase());
        return;
      }
      var url;
      try { url = new URL(href); } catch (e) {
        a.setAttribute('data-mp-kind', 'relative');
        a.removeAttribute('href');
        return;
      }
      if (url.protocol === 'http:' || url.protocol === 'https:') {
        a.setAttribute('data-mp-kind', 'web');
        a.setAttribute('data-mp-url', url.href);
        a.setAttribute('href', url.href);
      } else if (url.protocol === 'mailto:') {
        a.setAttribute('data-mp-kind', 'mail');
        a.setAttribute('data-mp-url', url.href);
        a.setAttribute('href', url.href);
      } else {
        unwrap(a);        // any other kind of link is shown as plain text
      }
    });

    body.querySelectorAll('img').forEach(function (img) {
      var src = (img.getAttribute('src') || '').trim();
      var url = null;
      try { url = new URL(src); } catch (e) { /* relative or empty */ }
      if (url && (url.protocol === 'http:' || url.protocol === 'https:')) {
        img.setAttribute('data-mp-kind', 'remote');
        img.setAttribute('data-mp-url', url.href);
        img.setAttribute('data-mp-host', url.host);
        img.setAttribute('src', url.href);
      } else if (IMAGE_DATA.test(src)) {
        img.setAttribute('data-mp-kind', 'embedded');
      } else {
        img.setAttribute('data-mp-kind', 'unavailable');
        img.removeAttribute('src');
      }
    });
  }

  /* ---------------------------------------------------------------- suspicious links */

  var COMMON_ENDINGS = /\.(?:com|org|net|edu|gov|mil|int|io|co|me|app|dev|info|biz|us|uk|ca|de|fr|es|it|nl|se|no|fi|dk|ch|at|be|ie|pl|pt|ru|jp|cn|in|au|nz|br|mx|ar|za|kr|tv|cc|xyz|online|site|shop|store|tech|ai|ly|to|gg|eu|onion)$/i;

  function bareHost(host) { return host.toLowerCase().replace(/^www\./, '').replace(/\.$/, ''); }

  // The site a piece of visible text claims to be, or '' when it does not look like an address.
  function claimedHost(text) {
    var t = text.trim();
    if (t === '' || /\s/.test(t)) return '';
    var withScheme = /^https?:\/\//i.test(t);
    var m = t.replace(/^https?:\/\//i, '').match(/^(?:[^@\/?#]*@)?([^\/?#:]+)/);
    if (!m) return '';
    var host = m[1];
    if (!/^[a-z0-9-]+(?:\.[a-z0-9-]+)+\.?$/i.test(host)) return '';
    if (!withScheme && !/^www\./i.test(host) && !COMMON_ENDINGS.test(host.replace(/\.$/, ''))) return '';
    return bareHost(host);
  }

  function linkWarnings(urlString, text) {
    var warnings = [];
    var url;
    try { url = new URL(urlString); } catch (e) { return ['The address could not be read.']; }
    if (url.protocol === 'mailto:') {
      var to = decodeURIComponentSafe(url.pathname).toLowerCase();
      var shown = text.trim().toLowerCase();
      if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(shown) && shown !== to) {
        warnings.push('The text shows the address ' + shown + ', but the email would go to ' + to + '.');
      }
      return warnings;
    }
    var host = url.hostname;
    var claim = claimedHost(text);
    var real = bareHost(host);
    if (claim && claim !== real && !real.endsWith('.' + claim)) {
      warnings.push('The text shows ' + claim + ', but the link goes to ' + real + '.');
    }
    if (/(^|\.)xn--/i.test(host)) {
      warnings.push('The site name contains letters from another alphabet, which can be used to imitate a familiar name. Its exact form is shown above.');
    }
    if (/^\d{1,3}(?:\.\d{1,3}){3}$/.test(host) || host.charAt(0) === '[') {
      warnings.push('The link goes to a bare numeric address instead of a named site.');
    }
    if (url.username !== '' || url.password !== '') {
      warnings.push('The address has a name in front of an @ sign. The real site is the part after the @.');
    }
    return warnings;
  }
  function decodeURIComponentSafe(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }

  /* ---------------------------------------------------------------- preview decoration */

  function imageAllowed(url, host) {
    return state.approveAll || state.approvedUrls[url] === true || state.approvedHosts[host] === true;
  }

  // Turns a cleaned fragment (or body) into what the preview shows: links lose their href and
  // gain the confirmation behaviour; remote images the reader has not allowed become placeholders.
  function decoratePreview(body, interactive) {
    var doc = body.ownerDocument;
    var mk = function (tag, cls, text) {
      var n = doc.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    };

    body.querySelectorAll('a').forEach(function (a) {
      var kind = a.getAttribute('data-mp-kind');
      a.removeAttribute('href');
      if (kind === 'relative') {
        var span = mk('span', 'mp-unavailable');
        span.setAttribute('title', 'This link has no site name in its address, so there is nothing to open.');
        while (a.firstChild) span.appendChild(a.firstChild);
        a.replaceWith(span);
        return;
      }
      a.setAttribute('role', 'link');
      a.setAttribute('tabindex', '0');
      if (kind === 'anchor') {
        a.className = 'mp-anchor';
        a.setAttribute('title', 'Jumps to a heading in this document');
        return;
      }
      var url = a.getAttribute('data-mp-url');
      var text = a.textContent;
      a.setAttribute('data-mp-text', text);
      a.className = 'mp-link';
      a.setAttribute('title', (kind === 'mail' ? 'Email link: ' : 'Goes to: ') + url);
      if (linkWarnings(url, text).length) {
        a.classList.add('mp-suspicious');
        var flag = mk('span', 'mp-flag', '⚠');
        flag.setAttribute('aria-label', 'Suspicious link');
        flag.setAttribute('title', 'This link may not be what it appears to be. Click it to see why.');
        a.appendChild(flag);
      }
    });

    body.querySelectorAll('img[data-mp-kind="remote"]').forEach(function (img) {
      var url = img.getAttribute('data-mp-url');
      var host = img.getAttribute('data-mp-host');
      if (imageAllowed(url, host)) {
        img.setAttribute('referrerpolicy', 'no-referrer');
        img.setAttribute('loading', 'lazy');
        img.setAttribute('decoding', 'async');
        return;
      }
      var box = mk('span', 'mp-blocked');
      box.setAttribute('data-mp-url', url);
      box.setAttribute('data-mp-host', host);
      var label = mk('span', null, 'Image blocked, from ');
      label.appendChild(mk('b', null, host));
      var alt = (img.getAttribute('alt') || '').trim();
      if (alt) label.appendChild(doc.createTextNode(' (“' + (alt.length > 60 ? alt.slice(0, 57) + '…' : alt) + '”)'));
      box.appendChild(label);
      if (interactive) {
        var one = mk('button', null, 'Load');
        one.setAttribute('type', 'button');
        one.setAttribute('data-mp-act', 'one');
        one.setAttribute('title', 'Load this one image from ' + host);
        box.appendChild(one);
        var all = mk('button', null, 'Load all from this site');     // labelled by refreshImageNotice()
        all.setAttribute('type', 'button');
        all.setAttribute('data-mp-act', 'host');
        all.setAttribute('title', 'Load every image in this document that comes from ' + host);
        all.setAttribute('hidden', '');
        box.appendChild(all);
      }
      img.replaceWith(box);           // the address never reaches the live page
    });

    body.querySelectorAll('img[data-mp-kind="unavailable"]').forEach(function (img) {
      var alt = (img.getAttribute('alt') || '').trim();
      var box = mk('span', 'mp-unavailable-img', 'Image unavailable' + (alt ? ': ' + alt : ''));
      box.setAttribute('title', 'This image has no site name in its address, so there is nowhere to load it from.');
      img.replaceWith(box);
    });
  }

  function moveInto(target, body) {
    var frag = document.createDocumentFragment();
    while (body.firstChild) frag.appendChild(document.adoptNode(body.firstChild));
    target.replaceChildren(frag);
  }

  /* ---------------------------------------------------------------- the live preview */

  var shown = [];            // what the preview holds now, in order: { key, nodes, remote, epoch }
  var approvalsEpoch = 0;    // raised whenever image approvals change
  var job = null;            // a redraw in progress
  var lastRenderCost = 0;    // how long the last redraw held the page, in milliseconds
  var SLICE_MS = 20;
  var BIG_DOCUMENT = 200000;  // characters; below this a newly loaded document is drawn in one go

  function cancelJob() {
    if (job && job.timer) clearTimeout(job.timer);
    job = null;
  }

  // Redraws the preview. Small documents finish at once. A large one is cleaned a slice at a time
  // so typing stays responsive; pass true to finish in one go (needed just before printing).
  function render(finishNow) {
    if (renderTimer) { clearTimeout(renderTimer); renderTimer = 0; }
    cancelJob();
    var started = performance.now();
    var text = el.editor.value;
    var chunks = planDocument(text);
    var todo = [];
    var seen = {};
    for (var i = 0; i < chunks.length; i++) {
      var key = chunks[i].key;
      if (!chunkCache.has(key) && seen[key] !== true) { seen[key] = true; todo.push(chunks[i]); }
    }
    job = { text: text, chunks: chunks, todo: todo, at: 0, timer: 0, cost: performance.now() - started };
    renderStep(finishNow === true);
  }

  function renderStep(finishNow) {
    var j = job;
    if (!j) return;
    j.timer = 0;
    var began = performance.now();
    while (j.at < j.todo.length) {
      cachedChunk(j.todo[j.at++]);
      if (!finishNow && performance.now() - began > SLICE_MS) {
        j.cost = Math.max(j.cost, performance.now() - began);
        j.timer = setTimeout(renderStep, 0);
        return;
      }
    }
    // Everything is cleaned. Keep only what this document uses, then update the page.
    var keep = new Map();
    j.chunks.forEach(function (c) { keep.set(c.key, chunkCache.get(c.key)); });
    chunkCache = keep;
    patchPreview(j.chunks);
    refreshImageNotice();
    updateCounts(j.text);
    updateTitle();
    if (state.sync && document.activeElement === el.editor) followEditor();
    lastRenderCost = Math.max(j.cost, performance.now() - began);
    job = null;
  }

  function stillShown(entry, key) {
    return entry.key === key && (!entry.remote || entry.epoch === approvalsEpoch);
  }

  // Replaces only the pieces of the preview that changed, leaving the rest of the page alone.
  function patchPreview(chunks) {
    var old = shown, n = chunks.length, m = old.length, i;
    var head = 0;
    while (head < n && head < m && stillShown(old[head], chunks[head].key)) head++;
    var tail = 0;
    while (tail < n - head && tail < m - head && stillShown(old[m - 1 - tail], chunks[n - 1 - tail].key)) tail++;
    for (i = head; i < m - tail; i++) old[i].nodes.forEach(function (node) { node.remove(); });
    var anchor = null;
    for (i = m - tail; i < m && !anchor; i++) if (old[i].nodes.length) anchor = old[i].nodes[0];
    var incoming = document.createDocumentFragment();
    var fresh = [];
    for (i = head; i < n - tail; i++) {
      var cached = chunkCache.get(chunks[i].key);
      var copy = cached.frag.cloneNode(true);          // still in the detached document
      decoratePreview(copy, true);
      var nodes = [];
      while (copy.firstChild) {
        var node = document.adoptNode(copy.firstChild);
        nodes.push(node);
        incoming.appendChild(node);
      }
      fresh.push({ key: chunks[i].key, nodes: nodes, remote: cached.remote, epoch: approvalsEpoch });
    }
    el.preview.insertBefore(incoming, anchor);
    shown = old.slice(0, head).concat(fresh, old.slice(m - tail));
  }

  // Counts the blocked images now on the page, labels the per-site buttons and updates the notice.
  function refreshImageNotice() {
    var boxes = el.preview.querySelectorAll('.mp-blocked');
    var perHost = {};
    boxes.forEach(function (box) {
      var host = box.getAttribute('data-mp-host');
      perHost[host] = (perHost[host] || 0) + 1;
    });
    boxes.forEach(function (box) {
      var btn = box.querySelector('button[data-mp-act="host"]');
      if (!btn) return;
      var count = perHost[box.getAttribute('data-mp-host')];
      btn.hidden = count < 2;
      btn.textContent = 'Load all ' + count + ' from this site';
    });
    // Remote images the reader allowed and that are showing now.
    var loaded = el.preview.querySelectorAll('img[data-mp-kind="remote"]');
    var loadedHosts = {};
    loaded.forEach(function (img) { loadedHosts[img.getAttribute('data-mp-host')] = true; });

    if (boxes.length) {
      el.imgNoticeText.textContent = plural(boxes.length, 'remote image is', 'remote images are') +
        ' blocked, from ' + plural(Object.keys(perHost).length, 'site', 'sites') + '.';
      el.imgLoadedText.textContent = loaded.length ? plural(loaded.length, 'is', 'are') + ' loaded.' : '';
    } else if (loaded.length) {
      el.imgNoticeText.textContent = plural(loaded.length, 'remote image is', 'remote images are') +
        ' loaded, from ' + plural(Object.keys(loadedHosts).length, 'site', 'sites') + '.';
      el.imgLoadedText.textContent = '';
    }
    el.imgLoadAll.hidden = boxes.length === 0;
    el.imgBlockAgain.hidden = loaded.length === 0;
    el.imgNotice.classList.toggle('calm', boxes.length === 0);
    el.imgWhy.textContent = boxes.length ? 'Why are they blocked?' : 'What does loading them reveal?';
    el.imgNotice.hidden = boxes.length === 0 && loaded.length === 0;
  }

  // Takes back every image approval for this document. It cannot undo what a site already learned.
  function blockImagesAgain() {
    clearApprovals();
    render();
    persist();
    flash('Remote images are blocked again in this document.');
  }

  function approvalsChanged() {
    approvalsEpoch++;
    render();
    persist();
  }

  function scheduleRender() {
    if (renderTimer) clearTimeout(renderTimer);
    cancelJob();
    // Wait a little longer when the last redraw was slow, so typing is never held up by it.
    renderTimer = setTimeout(render, clamp(Math.round(lastRenderCost * 1.5), 40, 900));
  }

  /* ---------------------------------------------------------------- export */

  // The formatted document as HTML text, with real links and images, for files and the clipboard.
  // blockedAsText: replace remote images the reader has not allowed with their description.
  function exportHtml(blockedAsText) {
    var body = safeBody(el.editor.value);
    var doc = body.ownerDocument;
    body.querySelectorAll('[data-mp-slug]').forEach(function (h) { h.setAttribute('id', h.getAttribute('data-mp-slug')); });
    body.querySelectorAll('a').forEach(function (a) {
      var kind = a.getAttribute('data-mp-kind');
      if (kind === 'relative') { unwrap(a); return; }
      if (kind === 'anchor') { a.setAttribute('href', '#' + a.getAttribute('data-mp-target')); return; }
      a.setAttribute('rel', 'noopener noreferrer');
    });
    body.querySelectorAll('img').forEach(function (img) {
      var kind = img.getAttribute('data-mp-kind');
      var alt = (img.getAttribute('alt') || '').trim();
      if (kind === 'unavailable' ||
          (kind === 'remote' && blockedAsText && !imageAllowed(img.getAttribute('data-mp-url'), img.getAttribute('data-mp-host')))) {
        img.replaceWith(doc.createTextNode('[image' + (alt ? ': ' + alt : '') + ']'));
        return;
      }
      if (kind === 'remote') img.setAttribute('referrerpolicy', 'no-referrer');
    });
    body.querySelectorAll('*').forEach(function (node) {
      Array.prototype.slice.call(node.attributes).forEach(function (attr) {
        if (attr.name.indexOf('data-mp-') === 0) node.removeAttribute(attr.name);
      });
    });
    return body.innerHTML;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function standalonePage() {
    var title = escapeHtml(displayName());
    return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
      '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src data: https: http:; style-src \'unsafe-inline\'">\n' +
      '<meta name="referrer" content="no-referrer">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<meta name="color-scheme" content="light dark">\n' +
      '<meta name="generator" content="MarkoPad ' + escapeHtml(BUILD.version) + '">\n' +
      '<title>' + title + '</title>\n<style>\n' +
      'html { background: #fff; }\n@media (prefers-color-scheme: dark) { html { background: #15181c; } }\n' +
      'body { margin: 0 auto; max-width: 860px; padding: 32px 20px 64px; }\n' +
      BUILD.mdCss + '</style>\n</head>\n<body class="md">\n' + exportHtml(false) + '\n</body>\n</html>\n';
  }

  /* ====================================================================== names and titles */

  function plainInline(s) {
    return s.replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/<[^>]+>/g, '').replace(/[*_`~]/g, '').trim();
  }
  function firstHeading(text) {
    var m = text.match(/^ {0,3}#{1,6}[ \t]+(.+?)[ \t]*#*[ \t]*$/m);
    return m ? plainInline(m[1]) : '';
  }
  function firstLine(text) {
    var m = text.match(/^[ \t]*(?:[-*+>]|\d+[.)])?[ \t]*(\S.*)$/m);
    return m ? plainInline(m[1]) : '';
  }
  function shorten(s, n) { return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; }

  // What this tab is called: file name, else first heading, else first line, else "Untitled 14:05".
  function displayName() {
    if (state.name) return state.name;
    var text = el.editor.value;
    return shorten(firstHeading(text) || firstLine(text), 60) || ('Untitled ' + state.startedAt);
  }
  function updateTitle() {
    document.title = (state.dirty ? '● ' : '') + displayName() + ' · MarkoPad';
  }
  function fileBase() {
    if (state.name) return state.name.replace(/\.(?:md|markdown|mdown|txt|text)$/i, '');
    var fromHeading = firstHeading(el.editor.value)
      .replace(/[\\/:*?"<>|\u0000-\u001f]/g, ' ').replace(/\s+/g, ' ').trim().replace(/^\.+/, '');
    return shorten(fromHeading, 80).replace(/…$/, '').replace(/ /g, '-') || 'untitled';
  }

  function updateCounts(text) {
    var lines = text === '' ? 0 : text.split('\n').length;
    var words = (text.match(/\S+/g) || []).length;
    var pairs = (text.match(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g) || []).length;
    el.counts.textContent = plural(lines, 'line', 'lines') + ' · ' + plural(words, 'word', 'words') +
      ' · ' + plural(text.length - pairs, 'character', 'characters');
  }

  /* ====================================================================== recovery copy */

  function snapshot() {
    return JSON.stringify({
      v: 1, text: el.editor.value, name: state.name, dirty: state.dirty, split: state.split,
      view: state.view, theme: state.theme, sync: state.sync, startedAt: state.startedAt,
      approvedUrls: Object.keys(state.approvedUrls), approvedHosts: Object.keys(state.approvedHosts),
      approveAll: state.approveAll
    });
  }
  function showRecovery(on, why) {
    el.recovery.textContent = on ? 'Recovery copy: on' : 'Recovery copy: off';
    el.recovery.classList.toggle('off', !on);
    if (!on) el.recovery.title = why;
  }
  function persist() {
    persistTimer = 0;
    if (!storageWorks) return;
    try {
      sessionStorage.setItem(STORE_KEY, snapshot());
      if (recoveryFailed) { recoveryFailed = false; showRecovery(true); }
    } catch (e) {
      try { sessionStorage.removeItem(STORE_KEY); } catch (e2) { /* nothing more to do */ }
      if (!recoveryFailed) {
        recoveryFailed = true;
        showRecovery(false, 'This document is too large for the browser to keep a recovery copy. A reload would lose it. Download the Markdown file to keep your work.');

      if (hit) shown++;
    });
    $('howto-empty').hidden = shown > 0;
  }
  function toggleHowto(open) {
    var show = open === undefined ? el.howto.hidden : open;
    if (show) buildHowto();
    el.howto.hidden = !show;
    el.btnHowto.setAttribute('aria-expanded', String(show));
    if (show) el.howtoSearch.focus(); else el.btnHowto.focus();
  }

  /* ====================================================================== start-up */

  function readStartHash() {
    var hash = location.hash;
    if (hash === '#new') return { kind: 'new' };
    if (hash === '#help' || hash.indexOf('#help=') === 0) return { kind: 'help', target: hash.slice(6) };
    return { kind: 'restore' };
  }
  function clearHash() {
    if (!location.hash) return;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* tried below */ }
    // A leftover "#new" would wipe the document on the next reload, so make sure it is gone.
    if (location.hash) { try { location.replace(location.pathname + location.search + '#'); } catch (e) { /* nothing more to try */ } }
  }

  function wire() {
    el.editor.addEventListener('beforeinput', function () { wasEmptyBeforeInput = el.editor.value === ''; });
    el.editor.addEventListener('paste', function () { wasEmptyBeforeInput = el.editor.value === ''; });
    el.editor.addEventListener('input', onEditorInput);
    el.editor.addEventListener('keydown', onEditorKeydown);
    el.editor.addEventListener('blur', function () { escapeArmed = false; });
    el.editor.addEventListener('scroll', function () { onScroll(el.editor, el.previewScroll); }, { passive: true });
    el.previewScroll.addEventListener('scroll', function () { onScroll(el.previewScroll, el.editor); }, { passive: true });

    el.btnNew.addEventListener('click', newDocument);
    el.btnOpen.addEventListener('click', function () { el.fileInput.click(); });
    el.fileInput.addEventListener('change', function () {
      var files = el.fileInput.files;
      if (files && files.length) openFile(files[0], files.length - 1);
      el.fileInput.value = '';
    });
    setupMenu(el.btnDownload, el.menuDownload);
    setupMenu(el.btnCopy, el.menuCopy);
    el.actSaveMd.addEventListener('click', saveMarkdown);
    el.actSaveHtml.addEventListener('click', saveHtml);
    el.actPrint.addEventListener('click', function () { render(true); window.print(); });
    el.actCopyMd.addEventListener('click', function () { copyText(el.editor.value, 'Markdown'); });
    el.actCopyRich.addEventListener('click', copyRich);
    el.actCopyHtml.addEventListener('click', function () { copyText(exportHtml(false), 'HTML'); });

    el.viewEdit.addEventListener('click', function () { setView('edit'); });
    el.viewBoth.addEventListener('click', function () { setView('both'); });
    el.viewPreview.addEventListener('click', function () { setView('preview'); });
    el.btnSync.addEventListener('click', function () { state.sync = !state.sync; applySync(); schedulePersist(); });
    el.btnTheme.addEventListener('click', function () {
      var dark = state.theme ? state.theme === 'dark' : systemDark();
      state.theme = dark ? 'light' : 'dark';
      applyTheme();
      schedulePersist();
    });
    el.btnHowto.addEventListener('click', function () { toggleHowto(); });
    el.howtoClose.addEventListener('click', function () { toggleHowto(false); });
    el.howtoSearch.addEventListener('input', filterHowto);
    el.imgLoadAll.addEventListener('click', function () { state.approveAll = true; approvalsChanged(); flash('Loading every image in this document'); });
    el.imgBlockAgain.addEventListener('click', blockImagesAgain);

    wireRendered(el.preview, el.previewScroll);
    setupDivider();

    document.addEventListener('pointerdown', function (ev) {
      if (openMenu && !openMenu.list.contains(ev.target) && ev.target !== openMenu.button) closeMenu(false);
    });
    window.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') {
        if (openMenu) { closeMenu(true); return; }
        if (!el.howto.hidden && !el.dlg.open && document.activeElement !== el.editor) { toggleHowto(false); return; }
      }
      var mod = (ev.ctrlKey || ev.metaKey) && !ev.altKey && !ev.shiftKey;
      if (!mod || el.dlg.open) return;
      var key = (ev.key || '').toLowerCase();
      if (key === 'o') { ev.preventDefault(); el.fileInput.click(); }
      else if (key === 's') { ev.preventDefault(); saveMarkdown(); }
    });

    // Dropping a file anywhere on the page opens it. Dragged text still drops into the text box.
    var dragDepth = 0;
    var hasFiles = function (ev) { return ev.dataTransfer && Array.prototype.indexOf.call(ev.dataTransfer.types || [], 'Files') >= 0; };
    window.addEventListener('dragenter', function (ev) { if (hasFiles(ev)) { dragDepth++; el.dropOverlay.hidden = false; ev.preventDefault(); } });
    window.addEventListener('dragover', function (ev) { if (hasFiles(ev)) { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; } });
    window.addEventListener('dragleave', function (ev) { if (hasFiles(ev) && --dragDepth <= 0) { dragDepth = 0; el.dropOverlay.hidden = true; } });
    window.addEventListener('drop', function (ev) {
      if (!hasFiles(ev)) return;
      ev.preventDefault();
      dragDepth = 0;
      el.dropOverlay.hidden = true;
      var files = ev.dataTransfer.files;
      if (files && files.length) openFile(files[0], files.length - 1);
    });

    window.addEventListener('beforeunload', function (ev) {
      if (persistTimer) persist();
      if (!state.dirty) return;
      ev.preventDefault();
      ev.returnValue = '';
    });
    window.addEventListener('pagehide', function () { if (persistTimer) persist(); });
    window.addEventListener('beforeprint', function () { if (job || renderTimer) render(true); });
    document.addEventListener('visibilitychange', function () { if (document.hidden && persistTimer) persist(); });

    var mq = window.matchMedia(NARROW_QUERY);
    var onWidth = function () { narrow = mq.matches; applyView(); };
    if (mq.addEventListener) mq.addEventListener('change', onWidth); else mq.addListener(onWidth);
    var dark = window.matchMedia('(prefers-color-scheme: dark)');
    if (dark.addEventListener) dark.addEventListener('change', applyTheme);
  }

  function start() {
    narrow = window.matchMedia(NARROW_QUERY).matches;
    var boot = readStartHash();
    var helpTarget = '';
    if (boot.kind === 'new') {
      wipeRecovery();
      restore();                    // only to learn whether storage works
    } else if (boot.kind === 'help') {
      wipeRecovery();
      restore();
      el.editor.value = BUILD.help;
      state.name = 'MarkoPad Help';
      state.view = narrow ? 'preview' : 'both';
      helpTarget = boot.target;
    } else {
      restore();
    }
    clearHash();
    el.version.textContent = 'v' + BUILD.version;
    el.version.title = 'MarkoPad version ' + BUILD.version;
    applyTheme();
    applySync();
    applySplit();
    applyView();
    wire();
    render(el.editor.value.length < BIG_DOCUMENT);
    if (boot.kind !== 'restore') persist();
    if (helpTarget) requestAnimationFrame(function () { jumpToHeading(helpTarget, el.preview, el.previewScroll); });
    else if (boot.kind !== 'help' && !narrow) el.editor.focus();
  }

  window.MarkoPad = { version: BUILD.version };
  start();
})();</script>
</body>
</html>
